<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novixis Teacher Login</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --primary-color: #0b5fb2;
            --secondary-color: #1a73e8;
            --text-color: #333;
            --bg-color: #f4f7f6;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-color);
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            border-color: var(--primary-color);
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 10px;
            transition: background 0.3s;
        }
        .btn:hover { background: var(--secondary-color); }
        .btn-google {
            background: white;
            color: var(--text-color);
            border: 1px solid #ddd;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .btn-google:hover { background: #f8f9fa; }
        .btn-link {
            background: none;
            color: var(--primary-color);
            padding: 0;
            display: inline;
            cursor: pointer;
            font-size: 13px;
            text-decoration: none;
            font-weight: 500;
        }
        .btn-link:hover { text-decoration: underline; }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: #aaa;
            font-size: 13px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ddd;
        }
        .divider:not(:empty)::before { margin-right: 15px; }
        .divider:not(:empty)::after { margin-left: 15px; }
        #error-msg {
            color: #d32f2f;
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }
        #success-msg {
            color: #2e7d32;
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">NOVIXIS</div>
        <div class="subtitle">Teacher Portal Access</div>
        
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="teacher@novixis.in">
        </div>
        <div class="input-group" id="password-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        
        <button class="btn" id="btn-login" onclick="loginWithEmail()">Sign In</button>
        <button class="btn btn-link" id="btn-magic-link" onclick="sendMagicLink()">Send Email Magic Link instead</button>
        
        <div class="divider">OR</div>
        
        <button class="btn btn-google" onclick="loginWithGoogle()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" width="18">
            Sign in with Google
        </button>
        
        <div id="error-msg"></div>
        <div id="success-msg"></div>
    </div>
    
    <script src="js/auth.js"></script>
</body>
</html>
